directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  # Tests and their fixtures (including throwaway test keys) never ship.
  - "!electron/testdata/**"
  - "!electron/**/*.test.mjs"
  - "!electron/**/*.test.cjs"
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
  - from: .electron-runtime/node_modules
    to: node_modules
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: .electron-runtime/harness-ui-mcp
    to: harness-ui-mcp
    filter:
      - "*.mjs"
  # Self-contained Python + vendored Hindsight memory engine, built by
  # scripts/hindsight/prepare-runtime.mjs (npm run package does this).
  - from: resources/hindsight-runtime
    to: hindsight-runtime
  # Every bundled third-party license, aggregated by
  # scripts/licenses/aggregate-licenses.mjs, plus Harness's own license.
  - from: resources/licenses
    to: licenses
  - from: ../../LICENSE
    to: licenses/LICENSE.harness.txt
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "*.wasm"
  - from: ../../packages/docs
    to: harness-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
publish:
  - provider: github
    owner: vaishnavjai
    repo: harness
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Harness uses the microphone when you allow a page to access audio input.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-apple-darwin
        - opencode2-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - opencode2-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "Harness Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/linux
  syncDesktopName: true
  extraResources:
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-unknown-linux-gnu
        - opencode2-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - opencode2-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode2.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode2-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - opencode2-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    - nsis
nsis:
  include: build/installer.nsh
