# Dev environment for Daytona / Codespaces / devcontainers.
#
# Runs the real Electron app with a virtual display accessible via noVNC.
#
# Ports:
#   - 5173  App Vite dev server (HMR)
#   - 6080  noVNC — see the Electron app in your browser
#   - 9825  CDP remote debugging (for Chrome MCP / automation)

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    ports:
      - "5173:5173"
      - "6080:6080"
      - "9825:9825"
    environment:
      # Display
      DISPLAY: ":99"
      ELECTRON_DISABLE_SANDBOX: "1"
      # Electron CDP debugging
      HARNESS_ELECTRON_REMOTE_DEBUG_PORT: "9825"
      HARNESS_DEV_MODE: "1"
    command: sleep infinity
